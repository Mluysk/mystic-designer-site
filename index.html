<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystic Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ece8e3;
      --text-primary: #23262b;
      --text-secondary: #666a73;
      --icon: #111111;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
    }
    .frame {
      width: 1440px;
      min-height: 900px;
      background: var(--bg);
      padding: 24px 40px 80px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 24px;
    }
    header {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: start;
    }
    .nav {
      grid-column: 2 / 6;
      display: flex;
      gap: 40px;
      font-size: 18px;
      font-weight: 500;
      margin-top: 6px;
    }
    .nav a {
      color: var(--text-primary);
      text-decoration: none;
      position: relative;
      padding-bottom: 6px;
    }
    .nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 52px;
      height: 2px;
      background: var(--text-primary);
    }
    .logo {
      grid-column: 6 / 8;
      justify-self: center;
      margin-top: -4px;
    }
    .logo svg {
      width: 88px;
      height: 110px;
    }
    .top-social {
      grid-column: 9 / 12;
      justify-self: end;
      display: flex;
      gap: 18px;
      font-size: 24px;
      margin-top: 2px;
    }
    .social {
      display: flex;
      gap: 18px;
      color: var(--icon);
    }
    .social svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--icon);
      stroke-width: 2.2px;
    }
    main {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      margin-top: 32px;
      row-gap: 28px;
    }
    .hero-social {
      grid-column: 2 / 6;
      display: flex;
      gap: 20px;
      font-size: 30px;
      margin-left: 6px;
    }
    .hero-head {
      grid-column: 2 / 11;
      display: grid;
      row-gap: 20px;
    }
    .eyebrow {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }
    .title {
      font-size: 172px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 170px;
      text-transform: uppercase;
      color: var(--text-primary);
      text-align: center;
    }
    .title span { display: block; }
    .decor-burst {
      grid-column: 11 / 13;
      justify-self: center;
      margin-top: 30px;
    }
    .decor-burst svg { width: 120px; height: 120px; }
    .lead {
      grid-column: 2 / 6;
      margin-top: 12px;
      font-size: 18px;
      line-height: 30px;
      color: var(--text-secondary);
      text-align: left;
    }
    .lead::after {
      content: "";
      display: block;
      width: 76px;
      height: 6px;
      background: var(--text-primary);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <nav class="nav">
        <a class="active" href="#">Home</a>
        <a href="#">About us</a>
        <a href="#">Projects <span aria-hidden="true">▼</span></a>
        <a href="#">Contact</a>
      </nav>
      <div class="logo">
        <svg viewBox="0 0 80 100" aria-label="Mystic Designer">
          <circle cx="40" cy="40" r="38" fill="none" stroke="#111" stroke-width="4"/>
          <rect x="30" y="20" width="20" height="40" fill="none" stroke="#111" stroke-width="4"/>
          <path d="M30 26 h20 M30 34 h20 M30 42 h20 M30 50 h20" stroke="#111" stroke-width="4"/>
          <text x="40" y="90" text-anchor="middle" fill="#111" font-family="Inter" font-size="10" font-weight="800">MYSTIC DESIGNER</text>
        </svg>
      </div>
      <div class="top-social social">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12a4 4 0 0 0 4 4c1.1 0 2-.9 2-2a2 2 0 0 0-2-2"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9 9h2V7.5C11 6.1 12 5 13.5 5H15v2h-1c-.6 0-1 .4-1 1V9h2l-.5 2H13v6h-2v-6H9V9z" fill="#111"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" ry="4"/><circle cx="12" cy="12" r="4" fill="none" stroke="#111" stroke-width="2"/><circle cx="17" cy="7" r="1.2" fill="#111"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" ry="3"/><path d="M8 17V10h2v7H8zm1-8.2c-.7 0-1.2-.5-1.2-1.2S8.3 6.3 9 6.3s1.2.5 1.2 1.2S9.7 8.8 9 8.8zm4 8.2h-2V10h2v1.2c.3-.6 1-1.4 2.3-1.4 1.6 0 2.7 1 2.7 3v4.2h-2v-3.7c0-1-.4-1.6-1.2-1.6-.9 0-1.4.7-1.4 1.6V17z" fill="#111"/></svg>
      </div>
    </header>

    <main>
      <div class="hero-social social">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12a4 4 0 0 0 4 4c1.1 0 2-.9 2-2a2 2 0 0 0-2-2"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9 9h2V7.5C11 6.1 12 5 13.5 5H15v2h-1c-.6 0-1 .4-1 1V9h2l-.5 2H13v6h-2v-6H9V9z" fill="#111"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" ry="4"/><circle cx="12" cy="12" r="4" fill="none" stroke="#111" stroke-width="2"/><circle cx="17" cy="7" r="1.2" fill="#111"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" ry="3"/><path d="M8 17V10h2v7H8zm1-8.2c-.7 0-1.2-.5-1.2-1.2S8.3 6.3 9 6.3s1.2.5 1.2 1.2S9.7 8.8 9 8.8zm4 8.2h-2V10h2v1.2c.3-.6 1-1.4 2.3-1.4 1.6 0 2.7 1 2.7 3v4.2h-2v-3.7c0-1-.4-1.6-1.2-1.6-.9 0-1.4.7-1.4 1.6V17z" fill="#111"/></svg>
      </div>

      <div class="hero-head">
        <p class="eyebrow">SUA MARCA É SUA IDENTIDADE</p>
        <div class="title">
          <span>DESIGN &amp;</span>
          <span>REGISTRO</span>
        </div>
      </div>

      <div class="decor-burst">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="55" fill="none"/>
          <g stroke="#23262b" stroke-width="10" stroke-linecap="butt">
            <line x1="60" y1="10" x2="60" y2="36"/>
            <line x1="60" y1="84" x2="60" y2="110"/>
            <line x1="10" y1="60" x2="36" y2="60"/>
            <line x1="84" y1="60" x2="110" y2="60"/>
            <line x1="24" y1="24" x2="42" y2="42"/>
            <line x1="78" y1="78" x2="96" y2="96"/>
            <line x1="96" y1="24" x2="78" y2="42"/>
            <line x1="24" y1="96" x2="42" y2="78"/>
          </g>
        </svg>
      </div>

      <p class="lead">
        A Mystic Designer® cuida da base do seu negócio: identidade visual, registro de marca, site profissional, sistemas sob medida e assessoria estratégica para você aparecer, vender e crescer do jeito certo.
      </p>
    </main>
  </div>
</body>
</html>
